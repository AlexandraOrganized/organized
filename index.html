<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<style>
/* Layout: squared-paper school notebook; sticky header with tabs (bottom bar on phones); one page per tab */
:root{
  --paper:#fbf5e9; --card:#fffcf5; --ink:#27311f; --muted:#69705c; --line:#ebe2cf;
  --grid:rgba(130,165,90,.07); --accent:#bdd89c; --accent-ink:#27311f; --accent-deep:#7f9f5a;
  --blush:#fdebef; --plant:#9fc27c; --plant-dk:#7d9f5c; --pot:#f6c3cf; --pot-dk:#eca7b8; --petal:#f7b4c6; --center:#f3d98e;
  --hi:#f9c9d6; --hi-ink:#4b1d2a; --good:#3f7d2a; --bad:#c23b4a; --warn:#a8650a;
  --chip-s:82%; --chip-l:91%; --chip-ts:55%; --chip-tl:27%;
  --shadow:0 1px 2px rgba(24,32,58,.06),0 4px 14px rgba(24,32,58,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#181b14; --card:#22261c; --ink:#f4eedf; --muted:#aab09b; --line:#353b2b;
  --grid:rgba(190,215,150,.05); --accent:#c5dfa6; --accent-ink:#181b14; --accent-deep:#b0d088;
  --blush:#2e2327; --plant:#93b871; --plant-dk:#6d8f4f; --pot:#d48e9e; --pot-dk:#bd7887; --petal:#eba6b8; --center:#e6cc84;
  --hi:#f3b8c8; --hi-ink:#3a1420; --good:#8fcf6e; --bad:#ff8b98; --warn:#efb257;
  --chip-s:38%; --chip-l:25%; --chip-ts:70%; --chip-tl:82%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#181b14; --card:#22261c; --ink:#f4eedf; --muted:#aab09b; --line:#353b2b;
  --grid:rgba(190,215,150,.05); --accent:#c5dfa6; --accent-ink:#181b14; --accent-deep:#b0d088;
  --blush:#2e2327; --plant:#93b871; --plant-dk:#6d8f4f; --pot:#d48e9e; --pot-dk:#bd7887; --petal:#eba6b8; --center:#e6cc84;
  --hi:#f3b8c8; --hi-ink:#3a1420; --good:#8fcf6e; --bad:#ff8b98; --warn:#efb257;
  --chip-s:38%; --chip-l:25%; --chip-ts:70%; --chip-tl:82%;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:24px;min-height:60px}
.logo{font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:-.02em;margin:0;line-height:1}
.logo .dot{display:inline-block;background:var(--hi);color:var(--hi-ink);border-radius:3px;padding:0 3px;margin-left:1px;transform:rotate(-4deg)}
nav.tabs{display:flex;gap:4px;margin-left:auto}
.head-garden{display:flex;align-items:flex-end;gap:3px;align-self:flex-end;padding-bottom:6px;min-width:0;overflow:hidden}
.head-garden svg{display:block;flex:none}
@media (max-width:1000px){.head-garden .hg-opt{display:none}}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;padding:8px 12px;border-radius:8px;display:flex;align-items:center;gap:7px;position:relative}
nav.tabs a svg{width:18px;height:18px;flex:none}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"]::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:7px;background:var(--hi);opacity:.85;z-index:-1;border-radius:2px;transform:skewX(-12deg)}
nav.tabs a span{position:relative}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}

main{max-width:1080px;margin:0 auto;padding-block:28px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;margin-bottom:22px}
.page-head h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.03em;line-height:1;margin:0;text-wrap:balance}
.page-head .sum{color:var(--muted);font-weight:500}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.pad{padding:18px}
.label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 10px}
h3.sec{font-family:var(--f-display);font-weight:600;font-size:20px;margin:0 0 12px;letter-spacing:-.01em}

.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.hi{background:var(--hi);border-color:var(--hi);color:var(--hi-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:17px;height:17px}
.icon-btn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--paper);color:var(--bad)}
.icon-btn svg{width:16px;height:16px}

input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{
  background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:90px}
.form-row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.form-row > *{flex:1 1 140px}
.form-row > .grow{flex:3 1 220px}
.form-row > .btn{flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;font-weight:600;color:var(--muted)}

.chip{--h:220;display:inline-flex;align-items:center;gap:6px;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-ts) var(--chip-tl));
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.chip.none{background:var(--paper);color:var(--muted);border-color:var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button.chip{cursor:pointer}
button.chip.filter{opacity:.55}
button.chip.filter[aria-pressed="true"]{opacity:1;border-color:currentColor}
.chip .x{border:0;background:transparent;color:inherit;cursor:pointer;padding:0;line-height:1;font-size:15px;opacity:.6}
.chip .x:hover{opacity:1}

/* Lists */
.list{list-style:none;margin:0;padding:0}
.item{display:flex;align-items:flex-start;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .body{flex:1;min-width:0}
.item .t{font-weight:500;overflow-wrap:anywhere}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:4px;font-size:13px;color:var(--muted)}
.item.done .t{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.check{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;flex:none;margin-top:1px;cursor:pointer;display:grid;place-items:center;background:var(--card)}
.check:checked{background:var(--good);border-color:var(--good)}
.check:checked::after{content:"";width:6px;height:11px;border:solid var(--card);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.due{font-weight:600;font-variant-numeric:tabular-nums}
.due.over{color:var(--bad)} .due.soon{color:var(--warn)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:600;font-size:18px;margin-bottom:4px}
details.donebox summary{cursor:pointer;padding:12px 14px;color:var(--muted);font-weight:600;border-top:1px solid var(--line);list-style:none}
details.donebox summary::-webkit-details-marker{display:none}

.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px;align-items:start}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}

/* Timetable */
.tt-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tt{display:grid;grid-template-columns:repeat(var(--days,5),minmax(120px,1fr));gap:10px;min-width:calc(var(--days,5) * 128px)}
.tt-day{display:flex;flex-direction:column;gap:6px;min-width:0}
.tt-day h4{margin:0;padding:8px 10px;font-family:var(--f-display);font-weight:600;font-size:15px;border-radius:8px;background:var(--card);border:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.tt-day.today h4{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.lesson{--h:220;text-align:left;border:0;cursor:pointer;border-radius:8px;padding:8px 10px;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-ts) var(--chip-tl));
  border-left:4px solid hsl(var(--h) 60% 50%);display:flex;flex-direction:column;gap:1px;min-width:0}
.lesson .tm{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.lesson .sb{font-weight:700;overflow-wrap:anywhere}
.lesson .rm{font-size:12px;opacity:.85}
.lesson.none{background:var(--card);color:var(--muted);border-left-color:var(--line)}
.add-slot{border:1px dashed var(--line);background:transparent;border-radius:8px;padding:6px;color:var(--muted);cursor:pointer;font-size:13px}
.add-slot:hover{color:var(--ink);border-color:var(--muted)}

/* Planner */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.pday{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:120px}
.pday.today{outline:3px solid var(--hi);outline-offset:-1px}
.pday h4{margin:0 0 2px;font-family:var(--f-display);font-weight:600;font-size:15px;display:flex;justify-content:space-between}
.pday h4 small{font-family:var(--f-body);color:var(--muted);font-weight:500;font-size:12px}
.blk{border-radius:7px;padding:6px 8px;font-size:13px;display:flex;gap:6px;align-items:flex-start;min-width:0}
.blk .bt{flex:1;min-width:0;overflow-wrap:anywhere}
.blk .tm{display:block;font-size:11.5px;font-variant-numeric:tabular-nums;opacity:.8}
.blk.hobby{background:repeating-linear-gradient(-45deg,var(--paper) 0 6px,transparent 6px 12px);border:1px solid var(--line);color:var(--muted)}
.blk.hobby b{color:var(--ink)}
.blk.study{--h:220;background:hsl(var(--h) var(--chip-s) var(--chip-l));color:hsl(var(--h) var(--chip-ts) var(--chip-tl))}
.blk.study.done{opacity:.55}
.blk.study.done .bt b{text-decoration:line-through}
.blk .icon-btn{width:22px;height:22px}
.blk .check{width:18px;height:18px;border-radius:5px}
.blk .check:checked::after{width:5px;height:9px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:5px}

/* Grades */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:9px 12px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;border-top:0}
td.num,th.num{text-align:right}
td.wrap{white-space:normal;min-width:120px}
.g{font-weight:700}
.g.pass{color:var(--good)} .g.fail{color:var(--bad)}
.avg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.avg{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;background:var(--card)}
.avg .n{font-family:var(--f-display);font-weight:800;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.avg .s{font-size:12.5px;color:var(--muted)}
.overall{display:flex;flex-wrap:wrap;align-items:center;gap:8px 22px;padding:16px 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink)}
.overall .n{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.overall .n .dotg{color:var(--hi)}
.overall .n{text-shadow:none}
.overall p{margin:0;opacity:.8;font-size:13.5px;max-width:46ch}

/* Overlay */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,14,30,.45);display:grid;place-items:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--card);border-radius:14px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:22px}
.sheet .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border:2.5px solid var(--line);border-top-color:var(--accent-deep);border-radius:50%;animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:var(--bad);font-weight:500}
.review{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.review li{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px}
.review li .body{flex:1;min-width:0}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.drop.over{border-color:var(--accent-deep);color:var(--ink)}
.preview-imgs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.preview-imgs img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted)}
.welcome{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;padding:14px 18px;margin-bottom:18px;border-radius:12px;background:var(--card);border:1px dashed var(--accent-deep)}
.welcome p{margin:0;flex:1 1 260px}

/* dates */
.dwrap{position:relative;display:block}
.dwrap input[type=date]{color:transparent;position:relative}
.dwrap input[type=date]::-webkit-datetime-edit{color:transparent}
.dwrap input[type=date]::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
.dshow{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none;font-variant-numeric:tabular-nums}
.dshow.ph{color:var(--muted)}
/* quote + plants */
.quote{display:flex;align-items:flex-end;gap:16px;background:var(--blush);border-radius:16px;padding:16px 18px 0 20px;margin-bottom:20px;overflow:hidden;min-height:96px}
.quote blockquote{margin:0 0 16px;flex:1;min-width:0;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.4vw,21px);line-height:1.3;letter-spacing:-.01em;text-wrap:balance}
.quote blockquote::before{content:"“";display:block;font-size:42px;line-height:.6;color:var(--pot-dk);margin-bottom:6px}
.garden{display:flex;align-items:flex-end;gap:2px;flex:none}
.garden svg{display:block;height:auto}
.empty .plant{display:block;margin:0 auto 10px;width:46px;height:auto}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
.hero h2{font-family:var(--f-display);font-weight:800;font-size:clamp(32px,7vw,52px);letter-spacing:-.03em;line-height:1;margin:0 0 6px;text-wrap:balance}
.hero .date{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px;display:flex;align-items:baseline;gap:8px}
.stat b{font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-weight:600;font-size:13.5px}
.home-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 6px}
.card-head h3{margin:0}
.more{color:var(--accent-deep);font-weight:600;text-decoration:none;font-size:14px}
.count-pill{font-variant-numeric:tabular-nums;font-weight:700;font-size:12.5px;border-radius:999px;padding:2px 9px;background:var(--accent);color:var(--accent-ink);white-space:nowrap}
.count-pill.soon{background:var(--hi);color:var(--hi-ink)}
.lbl-short{display:none}
@media (max-width:860px){.home-cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.garden .opt{display:none}.quote{padding-left:16px}}
@media (max-width:860px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .week{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
@media (max-width:720px){
  .top-in{min-height:54px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;background:var(--card);border-top:1px solid var(--line);z-index:20;justify-content:space-around;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px}
  .lbl-full{display:none}.lbl-short{display:inline}
  nav.tabs a svg{width:22px;height:22px}
  nav.tabs a[aria-current="page"]::after{bottom:auto;top:4px;height:24px;left:50%;width:44px;margin-left:-22px;right:auto;transform:none;border-radius:8px}
  nav.tabs a[aria-current="page"] svg{position:relative}
  .page-head .actions{margin-left:0;width:100%}
}

/* v4 additions */
.gear{width:38px;height:38px}.gear svg{width:20px;height:20px}.gear:hover{color:var(--ink);background:var(--paper)}
.tbtn{border:0;background:none;padding:0;margin:0;font:inherit;color:inherit;text-align:left;cursor:pointer;display:block;width:100%;min-width:0}
.tbtn:hover .t,.tbtn:hover b{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
.blk .tbtn{flex:1}
.icon-btn.mini{width:22px;height:22px}.icon-btn.mini:hover{color:var(--accent-deep)}
.icon-btn.edit:hover{color:var(--accent-deep)}
td.nowrap{white-space:nowrap}
.btn.small{padding:5px 10px;font-size:13.5px}
.btn.link{padding:2px 6px;color:var(--accent-deep)}
.inline-check{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;flex:0 0 auto!important}
.inline-check input{width:18px;height:18px;accent-color:var(--accent-deep)}
.reminders{background:var(--card);border:1px solid var(--pot-dk);border-radius:14px;padding:14px 16px;margin-bottom:18px;display:flex;flex-direction:column;gap:10px}
.rem-head{display:flex;align-items:center;gap:8px}.rem-head svg{width:20px;height:20px;color:var(--pot-dk)}
.reminders ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.reminders li{padding-left:16px;position:relative;overflow-wrap:anywhere}
.reminders li::before{content:"";position:absolute;left:0;top:.55em;width:8px;height:8px;border-radius:50%;background:var(--hi)}
.reminders li.over::before{background:var(--bad)}.reminders li.test::before{background:var(--accent-deep)}
.reminders .btn{align-self:flex-start}
.today-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.today-list li{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today-list .tm{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);width:46px}
.holiday-note{background:var(--blush);border-radius:10px;padding:10px 14px;margin:0 0 12px;font-weight:600}
.grow-card{display:flex;align-items:flex-end;gap:16px}
.grow-card svg{flex:none}
.weeknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pdate{font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted)}
.hol-tag,.test-tag{font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px;align-self:flex-start}
.hol-tag{background:var(--blush);color:var(--ink)}
.test-tag{background:var(--hi);color:var(--hi-ink)}
.timer-card{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.timer-ring{position:relative;width:180px;height:180px;margin:0 auto}
.timer-ring svg{width:100%;height:100%}
.timer-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center}
.timer-disp{font-family:var(--f-display);font-weight:800;font-size:38px;font-variant-numeric:tabular-nums;line-height:1}
.need-out{margin-top:12px}
.need{margin:0;padding:10px 12px;border-radius:10px;background:var(--paper);border-left:4px solid var(--good)}
.need.fail{border-left-color:var(--bad)}.need.warn{border-left-color:var(--warn)}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.sw-pick{cursor:pointer}.sw-pick input{position:absolute;opacity:0;pointer-events:none}
.sw-pick .chip{opacity:.6}.sw-pick input:checked + .chip{opacity:1;border-color:currentColor;box-shadow:0 0 0 2px var(--card),0 0 0 4px hsl(var(--h) 50% 55%)}
.sw-pick input:focus-visible + .chip{outline:2px solid var(--accent-deep);outline-offset:2px}
.set-sec{border-top:1px solid var(--line);padding-top:12px}
.hol-list{list-style:none;margin:0 0 8px;padding:0;display:flex;flex-direction:column;gap:4px}
.hol-list li{display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
@media (max-width:720px){.gear{margin-left:auto}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
</style>

<body>


<header class="top">
  <div class="top-in">

    <div class="head-garden" id="head-garden" aria-hidden="true"></div>
    <nav class="tabs" aria-label="Pages">
      <a href="#home" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#homework" data-page="homework"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg><span>Homework</span></a>
      <a href="#timetable" data-page="timetable"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M9 4v17M15 4v17"/></svg><span>Timetable</span></a>
      <a href="#study" data-page="study"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H2z"/><path d="M22 5h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></svg><span><span class="lbl-full">Study Planner</span><span class="lbl-short">Study</span></span></a>
      <a href="#tests" data-page="tests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14l2 2 4-4"/></svg><span>Tests</span></a>
    </nav>
    <button class="icon-btn gear" data-act="settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>

<main id="app"></main>
<div id="layer"></div>

<script>
(function(){
"use strict";
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const DSHORT=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const HUES=[95,340,30,160,275,15,200,55,320,130,245,5];
const ICON={
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  paste:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  sparkle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg>'

function growCactus(stage,w){

  const h=16+stage*9,top=64-h;let g=`<rect x="23" y="${top}" width="14" height="${h+2}" rx="7" fill="var(--plant)"/><path d="M30 ${top+6}v${h-8}" stroke="var(--plant-dk)" stroke-width="1.3" stroke-linecap="round"/>`;
  if(stage>=2){const ay=top+h*.5;g+=`<rect x="13" y="${ay}" width="13" height="8" rx="4" fill="var(--plant)"/><rect x="11" y="${ay-13}" width="8" height="21" rx="4" fill="var(--plant)"/>`;
    if(stage>=5)g+=flowerAt(15,ay-14,2.4)}
  if(stage>=3){const by=top+h*.32;g+=`<rect x="34" y="${by}" width="13" height="8" rx="4" fill="var(--plant)"/><rect x="41" y="${by-11}" width="8" height="19" rx="4" fill="var(--plant)"/>`;
    if(stage>=5)g+=flowerAt(45,by-12,2.4)}
  if(stage>=4)g+=flowerAt(30,top-1,3.2);
  return `<svg width="${w}" viewBox="0 0 60 90" aria-hidden="true" style="overflow:visible">${g}${pot}</svg>`}

async function saveFile(filename,data,okMsg){
  try{const type=filename.endsWith(".ics")?"text/calendar":filename.endsWith(".json")?"application/json":"text/plain";
    const blob=new Blob([data],{type});
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){
      try{await navigator.share({files:[file]});toast(okMsg);return}catch(e){if(e&&e.name==="AbortError")return}}
    const url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast(okMsg)}

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,"0")}
function isoDate(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function todayISO(){return isoDate(new Date())}
function dayIdx(d){return (d.getDay()+6)%7}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(iso,n){const d=parseISO(iso);d.setDate(d.getDate()+n);return isoDate(d)}
function mondayOf(iso){return addDays(iso,-dayIdx(parseISO(iso)))}
function diffDays(iso){return Math.round((parseISO(iso)-parseISO(todayISO()))/864e5)}
function fmtDate(iso){const d=parseISO(iso);return pad(d.getDate())+"."+pad(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)}
function dueLabel(iso){if(!iso)return {t:"No date",c:""};const n=diffDays(iso);
  if(n<0)return {t:n===-1?"Yesterday":Math.abs(n)+" days late",c:"over"};
  if(n===0)return {t:"Today",c:"soon"};if(n===1)return {t:"Tomorrow",c:"soon"};
  return {t:DSHORT[dayIdx(parseISO(iso))]+" "+fmtDate(iso),c:""}}
function holidayOn(iso){return S.holidays.find(h=>h.from&&h.to&&iso>=h.from&&iso<=h.to)}
function nextLesson(sid){if(!sid)return null;const t=todayISO();
  for(let i=1;i<=42;i++){const d=addDays(t,i),wd=dayIdx(parseISO(d));if(wd>5||holidayOn(d))continue;
    if(S.lessons.some(l=>l.subjectId===sid&&l.day===wd))return d}return null}

/* ---------- misc helpers ---------- */
function subj(id){return S.subjects.find(s=>s.id===id)}
function chip(id){const s=subj(id);return s?`<span class="chip" style="--h:${s.h}">${esc(s.name)}</span>`:`<span class="chip none">No subject</span>`}
function ensureSubject(name){name=String(name||"").trim();if(!name)return null;
  const f=S.subjects.find(s=>s.name.toLowerCase()===name.toLowerCase());if(f)return f.id;
  const used=S.subjects.map(s=>s.h);const h=HUES.find(x=>!used.includes(x))??HUES[S.subjects.length%HUES.length];
  const s={id:uid(),name,h};S.subjects.push(s);return s.id}
function findSubject(name){name=String(name||"").trim().toLowerCase();return S.subjects.find(s=>s.name.toLowerCase()===name)}
function subjectOptions(sel){return `<option value="">Subject…</option>`+S.subjects.map(s=>`<option value="${s.id}"${s.id===sel?" selected":""}>${esc(s.name)}</option>`).join("")}
function fmtGrade(n){return (Math.round(n*100)/100).toFixed(2)}
function roundTo(v,step){if(!step)return v;return Math.round(v/step)*step}
function fmtRounded(v){const st=+S.settings.round;const r=roundTo(v,st);return st===0.25?r.toFixed(2):st?r.toFixed(1):fmtGrade(r)}
function toast(t){const el=document.createElement("div");el.className="toast";el.setAttribute("role","status");el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600)}
function normTime(t){const m=String(t||"").trim().match(/^(\d{1,2})\s*[:.h ]?\s*(\d{2})$/);if(!m)return "";const h=+m[1],mi=+m[2];return h>23||mi>59?"":pad(h)+":"+pad(mi)}
function toMin(t){const [h,m]=(t||"0:0").split(":").map(Number);return h*60+m}
function fromMin(m){return pad(Math.floor(m/60))+":"+pad(m%60)}
function dur(s){return Math.max(0,toMin(s.end)-toMin(s.start))}
function fmtMin(m){const h=Math.floor(m/60),r=m%60;return h?(h+" h"+(r?" "+r+" min":"")):r+" min"}
function dateInput(id,name,val,req){return `<span class="dwrap"><input type="date" id="${id}" name="${name}" value="${esc(val||"")}"${req?" required":""}><span class="dshow${val?"":" ph"}">${val?fmtDate(val):"Pick a date"}</span></span>`}
function setDate(id,val){const i=document.getElementById(id);if(!i)return;i.value=val||"";i.dispatchEvent(new Event("input",{bubbles:true}))}
function timeInput(id,name,val,req){return `<input type="text" inputmode="numeric" id="${id}" name="${name}" value="${esc(val||"")}" placeholder="16:30" maxlength="5" autocomplete="off"${req?" required":""}>`}

/* sessions for a given date (recurring + one-off) */
function sessionsOn(iso){const wd=dayIdx(parseISO(iso));return S.sessions.filter(s=>s.date?s.date===iso:s.day===wd)}
function isDone(s,iso){return (s.doneOn||[]).includes(s.date?s.date:mondayOf(iso))}
function lessonsEnd(iso){const wd=dayIdx(parseISO(iso));if(wd>5||holidayOn(iso))return 0;
  const ls=S.lessons.filter(l=>l.day===wd&&l.end);return ls.length?Math.max(...ls.map(l=>toMin(l.end))):0}
function freeSlot(iso,len=45){const wd=dayIdx(parseISO(iso));
  const busy=[...S.hobbies.filter(h=>h.day===wd),...sessionsOn(iso)].map(b=>[toMin(b.start),toMin(b.end)]);
  let start=Math.max(wd>=5?10*60:15*60,lessonsEnd(iso)+45);start=Math.ceil(start/30)*30;
  for(let t=start;t+len<=20*60;t+=30){if(!busy.some(([a,b])=>t<b&&t+len>a))return {start:fromMin(t),end:fromMin(t+len)}}return null}
function suggestPrep(test){if(!test.date)return [];const out=[];const t=todayISO();
  for(const k of [3,2,1]){const d=addDays(test.date,-k);if(d<t)continue;const sl=freeSlot(d);if(sl)out.push({date:d,...sl})}return out}

/* ---------- calendar (.ics) ---------- */
function icsEsc(s){return String(s).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n")}
function buildICS(events){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Organized//School planner//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  events.forEach(ev=>{const d=ev.date.replace(/-/g,""),n=addDays(ev.date,1).replace(/-/g,"");
    L.push("BEGIN:VEVENT","UID:"+ev.uid+"@organized","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+d,"DTEND;VALUE=DATE:"+n,"SUMMARY:"+icsEsc(ev.title),"TRANSP:TRANSPARENT",
      "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.title),"TRIGGER:-PT6H","END:VALARM",
      ...(ev.early?["BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(ev.title),"TRIGGER:-P3DT6H","END:VALARM"]:[]),
      "END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n")+"\r\n"}
function testEvent(t){return {uid:"t-"+t.id,date:t.date,title:"Test: "+(subj(t.subjectId)?.name||"")+" – "+(t.topic||"Test"),early:true}}
function hwEvent(h){return {uid:"h-"+h.id,date:h.due,title:"Homework: "+(subj(h.subjectId)?.name?subj(h.subjectId).name+" – ":"")+h.text}}
function exportAll(){const t=todayISO();

  if(!ev.length){toast("Nothing with a date coming up yet.");return}
  saveFile("organized-reminders.ics",buildICS(ev),"Open the file to add the reminders to your calendar.")}

/* Focus timer */
ui.timer={len:25*60,left:25*60,running:false,mode:"Focus",label:"",end:0};
let tick=null,actx=null;
function paintTimer(){const tm=ui.timer;const d=document.getElementById("tm-disp"),a=document.getElementById("tm-arc");
  if(d)d.textContent=pad(Math.floor(tm.left/60))+":"+pad(tm.left%60);
  if(a)a.setAttribute("stroke-dashoffset",String(326.7*(1-tm.left/tm.len)))}
function timerStart(){const tm=ui.timer;if(tm.left<=0)tm.left=tm.len;tm.running=true;tm.end=Date.now()+tm.left*1000;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume&&actx.resume()}catch(_){}
  clearInterval(tick);tick=setInterval(()=>{tm.left=Math.max(0,Math.round((tm.end-Date.now())/1000));paintTimer();
    if(tm.left===0){clearInterval(tick);tm.running=false;beep();
      if(tm.mode==="Focus"){toast("Well done! Time for a 5 minute break.");tm.mode="Break";tm.len=tm.left=5*60}else{toast("Break over. Ready for the next round?");tm.mode="Focus";tm.len=tm.left=25*60}
      if(page()==="study")render()}},500);if(page()==="study")render()}
function timerPause(){clearInterval(tick);ui.timer.running=false;if(page()==="study")render()}
function beep(){try{if(!actx)return;[0,0.35,0.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.frequency.value=880;os.connect(g);g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,actx.currentTime+o);g.gain.exponentialRampToValueAtTime(0.25,actx.currentTime+o+0.02);g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+o+0.3);os.start(actx.currentTime+o);os.stop(actx.currentTime+o+0.32)})}catch(_){}}

function updateNeed(){const out=document.getElementById("need-out");if(!out)return;
  const sid=document.getElementById("need-subj")?.value,goal=parseFloat(document.getElementById("need-goal")?.value),w=parseFloat(document.getElementById("need-w")?.value)||1;
  ui.needSubj=sid;ui.needGoal=goal;ui.needW=w;
  const gs=S.grades.filter(g=>g.subjectId===sid);if(!sid||!gs.length){out.innerHTML=`<p class="note" style="margin:0">Add at least one grade in a subject to use this.</p>`;return}
  if(!(goal>=1&&goal<=6)){out.innerHTML=`<p class="note err" style="margin:0">Pick a goal between 1 and 6.</p>`;return}
  const W=gs.reduce((a,g)=>a+(+g.weight||1),0),sum=gs.reduce((a,g)=>a+g.grade*(+g.weight||1),0);
  const need=(goal*(W+w)-sum)/w;const now=sum/W;
  let msg,cls;
  if(need>6){msg=`You'd need a ${fmtGrade(need)}, which isn't possible in one test. A 6 would bring you to ${fmtGrade((sum+6*w)/(W+w))}.`;cls="fail"}
  else if(need<=1){msg=`You've got this already. Even a 1 keeps you at ${fmtGrade((sum+w)/(W+w))} or more.`;cls="pass"}
  else{msg=`Right now you're at ${fmtGrade(now)}. To reach ${goal.toFixed(1)}, you need at least a <b>${fmtGrade(Math.ceil(need*4)/4)}</b> in the next test.`;cls=need<=5?"pass":"warn"}
  out.innerHTML=`<p class="need ${cls}">${msg}</p>`}

  case "ph-read":runRead();return;
  case "hw-filter":ui.hwFilter=id;render();return;
  case "toggle-done":e.preventDefault();ui.showDone=!ui.showDone;render();return;
  case "toggle-tests-done":e.preventDefault();ui.showTestsDone=!ui.showTestsDone;render();return;
  case "edit":editSheet(t.dataset.col,id);return;
  case "del":case "del-sheet":{const col=t.dataset.col;S[col]=S[col].filter(x=>x.id!==id);if(col==="tests")S.grades.forEach(g=>{if(g.testId===id)g.testId=null});if(a==="del-sheet")closeSheet();commit();return}
  case "edit-subj":subjectSheet(id);return;
  case "subj-del":{const used=[...S.homework,...S.lessons,...S.sessions,...S.tests,...S.grades].some(x=>x.subjectId===id);if(used){subjectSheet(id,true);return}}
  // fallthrough
  case "subj-del-yes":S.subjects=S.subjects.filter(s=>s.id!==id);if(ui.hwFilter===id)ui.hwFilter="all";closeSheet();commit();return;
  case "next-lesson":{const sid=document.getElementById(t.dataset.subj)?.value;
    if(!sid){toast("Pick a subject first.");return}const d=nextLesson(sid);
    if(!d){toast((subj(sid)?.name||"This subject")+" isn't in your timetable yet.");return}setDate(t.dataset.target,d);toast("Due "+dueLabel(d).t.toLowerCase());return}
  case "rv-hw":{let n=0;pending.items.forEach((i,k)=>{if(document.getElementById("rv-"+k)?.checked){S.homework.push({id:uid(),text:i.task,subjectId:ensureSubject(i.subject),due:i.due,done:false,fromPhoto:true,created:Date.now()});n++}});
    closeSheet();commit();toast(n+" added");return}
  case "rv-tt-replace":case "rv-tt-add":{if(a==="rv-tt-replace")S.lessons=[];const ls=pending.lessons;
    ls.forEach(l=>S.lessons.push({id:uid(),day:l.day,start:l.start,end:l.end,subjectId:ensureSubject(l.subject),room:l.room}));closeSheet();commit();toast("Timetable updated: "+ls.length+" lessons");return}
  case "edit-lesson":lessonSheet(S.lessons.find(l=>l.id===id));return;
  case "new-lesson":lessonSheet(null,+t.dataset.day);return;
  case "del-lesson":S.lessons=S.lessons.filter(l=>l.id!==id);closeSheet();commit();return;
  case "clear-tt":ui.confirmClearTT=true;render();return;
  case "clear-tt-no":ui.confirmClearTT=false;render();return;
  case "clear-tt-yes":ui.confirmClearTT=false;S.lessons=[];commit();return;
  case "grade-from":{const x=S.tests.find(q=>q.id===id);ui.gradeForm={subjectId:x.subjectId,name:x.topic,date:x.date,testId:x.id};render();
    const g=document.getElementById("g-grade");if(g){g.scrollIntoView({block:"center"});g.focus()}return}
  case "prep":prepSheet(S.tests.find(q=>q.id===id));return;
  case "prep-add":{let n=0;const tst=pending.test;pending.prep.forEach((s,k)=>{if(document.getElementById("pp-"+k)?.checked){S.sessions.push({id:uid(),day:dayIdx(parseISO(s.date)),date:s.date,start:s.start,end:s.end,subjectId:tst.subjectId||null,topic:"Prep: "+(tst.topic||"test"),doneOn:[]});n++}});
    closeSheet();commit();toast(n+" study slot"+(n===1?"":"s")+" added");return}
  case "ics-one":{const x=S.tests.find(q=>q.id===id);if(x)saveFile("test-"+(x.topic||"test").replace(/[^\w-]+/g,"-").slice(0,30)+".ics",buildICS([testEvent(x)]),"Open the file to add it to your calendar.");return}
  case "export-ics":exportAll();return;
  case "backup":saveFile("organized-backup-"+todayISO()+".json",JSON.stringify({v:2,...S},null,1),"Backup saved.");return;
  case "restore-yes":if(pending&&pending.restore){S=pending.restore;closeSheet();commit();toast("Backup restored")}return;
  case "hol-del":S.holidays=S.holidays.filter(h=>h.id!==id);commit();settingsSheet();return;
  case "wipe":document.getElementById("wipe-confirm").innerHTML=`<p class="err" style="margin:8px 0">This deletes all subjects, homework, tests, grades and plans. It can't be undone.</p><button class="btn primary" data-act="wipe-yes">Yes, delete everything</button>`;return;
  case "wipe-yes":S=empty();closeSheet();commit();toast("All data deleted");return;
  case "week":{const d=+t.dataset.d;ui.week=d===0?0:ui.week+d;render();return}
  case "timer-set":{timerPause();const m=+t.dataset.min;Object.assign(ui.timer,{len:m*60,left:m*60,mode:t.dataset.mode,label:""});render();return}
  case "timer-toggle":ui.timer.running?timerPause():timerStart();return;
  case "timer-reset":timerPause();ui.timer.left=ui.timer.len;render();return;
  case "timer-start":{const s=S.sessions.find(q=>q.id===id);timerPause();const m=s?Math.max(5,Math.min(90,dur(s)||25)):25;
    Object.assign(ui.timer,{len:m*60,left:m*60,mode:"Focus",label:s?(subj(s.subjectId)?.name||"Study"):""});timerStart();
    document.querySelector(".timer-card")?.scrollIntoView({block:"center",behavior:"smooth"});return}
  case "example":loadExample();return;
  }
});
document.addEventListener("change",e=>{
  const t=e.target;if(t.id==="set-round"){S.settings.round=parseFloat(t.value);commit();return}
  if(t.id==="ses-repeat"){ui.sesRepeat=t.checked;return}
  const a=t.dataset&&t.dataset.act,id=t.dataset&&t.dataset.id;if(!a)return;
  if(a==="hw-toggle"){const x=S.homework.find(i=>i.id===id);if(!x)return;x.done=t.checked;x.doneAt=t.checked?Date.now():null;
    const before=stageOf(S.stats.done||0);S.stats.done=Math.max(0,(S.stats.done||0)+(t.checked?1:-1));
    if(t.checked&&stageOf(S.stats.done)>before)toast("Your cactus just grew! 🌵");commit();return}
  if(a==="test-toggle"){const x=S.tests.find(i=>i.id===id);if(!x)return;x.done=t.checked;commit();return}
  if(a==="ses-toggle"){const x=S.sessions.find(i=>i.id===id);if(!x)return;const key=x.date?x.date:mondayOf(t.dataset.date);
    x.doneOn=(x.doneOn||[]).filter(k=>k!==key);if(t.checked)x.doneOn.push(key);x.doneOn=x.doneOn.slice(-20);commit();return}
});
document.addEventListener("submit",e=>{
  const f=e.target.closest("[data-form]");if(!f)return;e.preventDefault();const v=Object.fromEntries(new FormData(f));
  switch(f.dataset.form){
    case "need":return;
    case "subj":{const n=(v.name||"").trim();if(!n)return;
      if(findSubject(n)){ui.subjMsg=n+" already exists.";render();return}
      ui.subjMsg="";ensureSubject(n);commit();document.getElementById("subj-name")?.focus();return}
    case "subj-edit":{const s=subj(f.dataset.id);const n=(v.name||"").trim();if(!s||!n)return;
      const other=findSubject(n);if(other&&other.id!==s.id){toast(n+" already exists.");return}
      s.name=n;s.h=+v.h||s.h;closeSheet();commit();return}
    case "hw":{const tx=(v.text||"").trim();if(!tx)return;ui.lastSubj=v.subj;ui.lastDue=v.due;ui.hwMsg="";
      S.homework.push({id:uid(),text:tx,subjectId:v.subj||null,due:v.due||"",done:false,created:Date.now()});commit();
      const i=document.getElementById("hw-text");if(i){i.value="";i.focus()}return}
    case "test":{const tp=(v.topic||"").trim();if(!tp)return;const x={id:uid(),topic:tp,subjectId:v.subj||null,date:v.date||"",done:false};S.tests.push(x);commit();
      if(x.date&&diffDays(x.date)>0)prepSheet(x);return}
    case "grade":{const g=parseFloat(String(v.grade).replace(",","."));
      if(!v.subj){ui.gradeMsg="Pick a subject for this grade.";render();return}
      if(!(g>=1&&g<=6)){ui.gradeMsg="Grades go from 1 to 6.";render();return}
      ui.gradeMsg="";S.grades.push({id:uid(),subjectId:v.subj,name:(v.name||"").trim(),date:v.date||"",grade:g,weight:parseFloat(v.weight)||1,testId:ui.gradeForm?.testId||null});
      ui.gradeForm=null;commit();toast("Grade added");return}
    case "ses":{const d=+v.day;ui.sesDay=d;v.start=normTime(v.start);v.end=normTime(v.end);
      if(!v.start||!v.end){ui.sesMsg="Write times like 16:30.";render();return}
      if(toMin(v.end)<=toMin(v.start)){ui.sesMsg="The end time has to be after the start time.";render();return}
      const repeat=!!v.repeat;ui.sesRepeat=repeat;const mon=addDays(mondayOf(todayISO()),7*ui.week);
      const c=S.hobbies.find(h=>h.day===d&&toMin(v.start)<toMin(h.end)&&toMin(v.end)>toMin(h.start));
      ui.sesMsg=c?`Heads up: this overlaps with ${c.name} (${c.start}–${c.end}). Added anyway.`:"";
      S.sessions.push({id:uid(),day:d,date:repeat?null:addDays(mon,d),start:v.start,end:v.end,subjectId:v.subj||null,topic:(v.topic||"").trim(),doneOn:[]});commit();return}
    case "hob":{const n=(v.name||"").trim();if(!n)return;v.start=normTime(v.start);v.end=normTime(v.end);
      if(!v.start||!v.end){ui.hobMsg="Write times like 17:30.";render();return}
      if(toMin(v.end)<=toMin(v.start)){ui.hobMsg="The end time has to be after the start time.";render();return}
      ui.hobMsg="";S.hobbies.push({id:uid(),name:n,day:+v.day,start:v.start,end:v.end});commit();return}
    case "hol":{const msg=document.getElementById("hol-msg");
      if(!v.from||!v.to){msg.textContent="Pick both dates.";return}if(v.to<v.from){msg.textContent="The last day has to be after the first day.";return}
      S.holidays.push({id:uid(),name:(v.name||"").trim()||"Holidays",from:v.from,to:v.to});commit();settingsSheet();return}
    case "lesson":{const msg=document.getElementById("ls-msg");v.start=normTime(v.start);const end=v.end?normTime(v.end):"";
      if(!v.start){msg.textContent="Write the start time like 08:15.";return}if(v.end&&!end){msg.textContent="Write the end time like 09:00.";return}
      let sid=v.subj;if(sid==="__new")sid=ensureSubject(v.newsubj)||"";
      const data={day:+v.day,start:v.start,end,subjectId:sid||null,room:(v.room||"").trim()};
      if(f.dataset.id){Object.assign(S.lessons.find(l=>l.id===f.dataset.id)||{},data)}else S.lessons.push({id:uid(),...data});
      closeSheet();commit();return}
    case "edit":{const col=f.dataset.col,x=S[col].find(i=>i.id===f.dataset.id),msg=document.getElementById("e-msg");if(!x)return;
      if(col==="homework"){const tx=(v.text||"").trim();if(!tx){msg.textContent="Write what to do.";return}Object.assign(x,{text:tx,subjectId:v.subj||null,due:v.due||""})}
      if(col==="tests"){const tp=(v.topic||"").trim();if(!tp){msg.textContent="Write the topic.";return}Object.assign(x,{topic:tp,subjectId:v.subj||null,date:v.date||""})}
      if(col==="grades"){const g=parseFloat(String(v.grade).replace(",","."));if(!(g>=1&&g<=6)){msg.textContent="Grades go from 1 to 6.";return}if(!v.subj){msg.textContent="Pick a subject.";return}
        Object.assign(x,{subjectId:v.subj,name:(v.name||"").trim(),date:v.date||"",grade:g,weight:parseFloat(v.weight)||1})}
      if(col==="hobbies"||col==="sessions"){const st=normTime(v.start),en=normTime(v.end);if(!st||!en){msg.textContent="Write times like 16:30.";return}
        if(toMin(en)<=toMin(st)){msg.textContent="The end time has to be after the start time.";return}
        if(col==="hobbies")Object.assign(x,{name:(v.name||"").trim()||x.name,day:+v.day,start:st,end:en});
        else{Object.assign(x,{subjectId:v.subj||null,topic:(v.topic||"").trim(),start:st,end:en});if(x.date){if(v.date){x.date=v.date;x.day=dayIdx(parseISO(v.date))}}else x.day=+v.day}}
      closeSheet();commit();return}
  }
});

function loadExample(){
  const add=n=>ensureSubject(n);const M=add("Maths"),G=add("German"),E=add("English"),F=add("French"),N=add("Science"),H=add("History");
  const t=todayISO(),d=n=>addDays(t,n);
  S.homework.push({id:uid(),text:"Book p. 42, exercises 3–7",subjectId:M,due:d(1),done:false},
    {id:uid(),text:"Learn vocabulary unit 4",subjectId:F,due:d(2),done:false},
    {id:uid(),text:"Read chapter 3 and write 5 questions",subjectId:G,due:d(4),done:false},
    {id:uid(),text:"Worksheet: The Industrial Revolution",subjectId:H,due:d(-1),done:true,doneAt:Date.now()});
  const plan=[[M,G,E,N,F],[F,M,H,G,N],[E,N,M,F,G],[G,H,F,M,E],[N,E,G,H,M]];const times=[["08:00","08:45"],["08:50","09:35"],["09:55","10:40"],["10:45","11:30"],["13:30","14:15"]];
  plan.forEach((row,day)=>row.forEach((s,i)=>S.lessons.push({id:uid(),day,start:times[i][0],end:times[i][1],subjectId:s,room:String(100+((day*3+i)%12))})));
  S.hobbies.push({id:uid(),name:"Football training",day:1,start:"17:30",end:"19:00"},{id:uid(),name:"Piano lesson",day:3,start:"16:00",end:"16:45"},{id:uid(),name:"Football match",day:5,start:"10:00",end:"12:00"});
  S.sessions.push({id:uid(),day:0,date:null,start:"16:30",end:"17:15",subjectId:F,topic:"Vocab unit 4",doneOn:[]},{id:uid(),day:2,date:null,start:"15:00",end:"16:00",subjectId:M,topic:"Fractions practice",doneOn:[]});
  S.tests.push({id:uid(),topic:"Fractions",subjectId:M,date:d(6),done:false},{id:uid(),topic:"Vocabulary unit 4",subjectId:F,date:d(3),done:false},{id:uid(),topic:"Grammar test",subjectId:G,date:d(-5),done:true});
  S.grades.push({id:uid(),subjectId:M,name:"Equations",date:d(-20),grade:5,weight:1},{id:uid(),subjectId:M,name:"Quiz",date:d(-9),grade:4.5,weight:0.5},
    {id:uid(),subjectId:F,name:"Vocab unit 3",date:d(-14),grade:5.5,weight:1},{id:uid(),subjectId:G,name:"Essay",date:d(-12),grade:4.75,weight:2},{id:uid(),subjectId:E,name:"Reading",date:d(-7),grade:5.25,weight:1});
  S.stats.done=(S.stats.done||0)+4;
  commit();toast("Example week loaded. Delete it any time in settings.");
}

const local=loadLocal();if(local)S=local;
render();renderHeader();
connectDb();connectCaps();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(_){}

})();
